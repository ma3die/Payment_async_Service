[flake8]

ignore = E203
max-cognitive-complexity = 8
max-line-length = 120
exclude =
    .git
    __pycache__
    build
    dist
    venv
    spam
    *migrations
    base_*
    .\.venv\


[pytest]
# Setting error output to a more compact format:
addopts = --tb=short --maxfail=1

# Output only one line per test:
junit_family = xunit1

# Async mode
asyncio_mode = auto

log_level = INFO
faulthandler_timeout = 60
filterwarnings =
    ignore::DeprecationWarning

testpaths = tests
pythonpath = src